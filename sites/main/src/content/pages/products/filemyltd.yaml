      "body": "What directors ask before filing their own company accounts.\n\n### Got a question we haven't covered?\n\nAsk the FileMyLtd team at hello@filemyltd.co.uk, or send us a message here.\n\n- Plain-English answers\n\n- From the people who built it\n\n- No sales pitch\n\n[Ask us anything](/contact)\n\n**Can I file my own company accounts without an accountant?**\n\nYes. Directors can file their own company's accounts, and most dormant and micro-entity companies don't need an accountant to do it. The director is responsible for the accounts either way. FileMyLtd prepares and checks the accounts, and you approve and submit them yourself.\n\n**How do I file dormant company accounts?**\n\nDormant accounts are filed with Companies House within 9 months of the company's financial year end. In FileMyLtd you enter your company number, answer the dormancy questions, check the accounts and submit them with your company authentication code. From 1 April 2028, Companies House will only accept accounts filed with software.\n\n**Can I still file a CT600 on HMRC's website?**\n\nNo. HMRC closed its \"File your accounts and Company Tax Return\" online service on 31 March 2026. Companies now have to use commercial software to file a CT600. FileMyLtd prepares the CT600 from your micro-entity accounts and submits it to HMRC once you approve it.\n\n**Is my company a micro-entity?**\n\nFor accounting periods starting on or after 6 April 2025, a company is a micro-entity if it meets at least two of these limits: turnover of £1 million or less, a balance sheet total of £500,000 or less, and 10 or fewer employees on average.\n\n**What happens if I file my company accounts late?**\n\nCompanies House charges a private company a late filing penalty of £150 if the accounts are up to one month late, rising to £375, £750 and £1,500 the later they are. The penalty is doubled if accounts are late in two financial years in a row. HMRC charges separate penalties for a late CT600.\n\n**Is FileMyLtd approved by HMRC or Companies House?**\n\nFileMyLtd is independent software. It is not part of, endorsed by or affiliated with Companies House or HMRC. It sends filings through their official software filing services and is in early access while filing is tested with both.\n\n**How much does FileMyLtd cost?**\n\nEach company has its own yearly plan, one for dormant companies and one for micro-entities that includes the CT600. Current prices, including the early-access offer, are on the FileMyLtd pricing page."
