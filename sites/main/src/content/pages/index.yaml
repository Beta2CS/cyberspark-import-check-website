      "title": "Questions About Working With a Software Development Company",
      "body": "Contracts and ownership, time zones, existing code, hiring in India, and how projects are priced.\n\n### Have a project or hiring question?\n\nTell us what you need and we will reply with practical next steps, and a call if it helps.\n\n- A free first conversation, with no obligation\n\n- Talk to engineers, not a sales team\n\n- Happy to sign an NDA before you share details\n\n[Ask a specific question](/contact)\n\n**How do I choose a software development company in the UK?**\n\nLook past the portfolio. Ask who will actually build your software and whether you can talk to them, how they scope a project before quoting, how often you will see working software, who owns the code and accounts, and what happens after launch. A good company will also tell you when you don't need custom software at all.\n\n**Who owns the code and intellectual property?**\n\nYou do. You contract with our UK company, Cyber Spark IT Services Ltd, and the contract assigns the code, designs and documentation we create for you to your company. Repositories, hosting and domains can sit in your own accounts from the start, and everyone on the project is bound by confidentiality.\n\n**How does time zone alignment work between the UK and India?**\n\nIndia is 5½ hours ahead of the UK in winter and 4½ hours ahead during British Summer Time, so the UK morning overlaps with the Indian afternoon. We hold standups and reviews in that overlap, agree extra overlap hours where a project needs them, and hand work over in writing at the end of each day so nothing waits on a meeting.\n\n**Can CyberSpark take over or rescue an existing legacy codebase?**\n\nYes. We start by reviewing the code, hosting and documentation to see what is sound and what is holding you back, then agree a plan. That usually means stabilising and improving what you have in stages rather than rewriting everything.\n\n**What is the difference between hiring via CyberSpark EOR vs traditional agency outsourcing?**\n\nWith outsourcing, you hand over a defined scope and we deliver the finished software. With a dedicated team or an Employer of Record, the engineers work on your roadmap as part of your team and you direct the work, while we handle employment, payroll and compliance in India. Our guide compares [EOR, outsourcing and staff augmentation](/services/hire-developers-in-india/eor-vs-outsourcing).\n\n**What pricing models do you offer for UK companies?**\n\nTwo ways: a fixed price for a defined scope, agreed after discovery and paid by milestone, or a monthly fee for a dedicated team or EOR. We don't publish prices, because they depend on scope and team size; tell us what you need and we will quote in writing."
